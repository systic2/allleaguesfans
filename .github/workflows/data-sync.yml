name: "All Leagues Data Sync"

on:
  schedule:
    - cron: '0 * * * *'  # Run every hour at minute 0
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: read

# 이전 실행이 끝나기 전에 다음 정각이 오면 대기 (동시 delete-then-insert 방지)
concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Run Full Sync
      env:
        # DB Credentials (mapping standard secrets to what scripts expect)
        VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        
        # Try both common secret names. One of these MUST be set in Repo Settings > Secrets.
        VITE_SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE }} 
        SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE }}
        
        # API Keys
        THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
        
        # Config
        NODE_ENV: production
      run: |
        echo "🚀 Starting hourly sync for all leagues (K-League + Big 5)..."
        pnpm sync:full
        echo "✅ Sync completed successfully."
