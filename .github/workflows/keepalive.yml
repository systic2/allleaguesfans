# .github/workflows/keepalive.yml
name: Keep Repository Active

# 🔄 Keepalive Workflow
# Purpose: Prevent GitHub from disabling scheduled workflows
# GitHub disables scheduled workflows after 60 days of repository inactivity
# This workflow ensures continuous operation of data sync workflows

on:
  schedule:
    - cron: '0 0 * * 0'  # 매주 일요일 00:00 UTC (월간보다 여유를 둬서 60일 비활성 임계값에 안전마진 확보)

  workflow_dispatch: # Manual trigger available

jobs:
  keepalive:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep Repository Active
        run: |
          echo "🔄 Keepalive workflow running..."

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # .github/keepalive.log is covered by the repo-wide *.log gitignore rule,
          # so `git add` on it always failed and no commit/push ever happened.
          # An allow-empty commit sidesteps gitignore entirely and always succeeds.
          git commit --allow-empty -m "chore: keepalive $(date -u +%Y-%m-%d) [skip ci]"
          git push
          echo "✅ Keepalive commit pushed successfully"

      - name: Workflow Summary
        run: |
          echo "🎉 Keepalive Workflow Completed"
          echo "Status: Repository activity recorded"
          echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "Next run: next Sunday at 00:00 UTC"
