name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Type Checking
        id: typecheck
        run: pnpm typecheck

      - name: Run Tests
        id: test
        run: pnpm test
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon

      - name: Build Application
        id: build
        run: pnpm build

      - name: Upload Build Artifact (CI Verification)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist-pr-${{ github.event.pull_request.number }}
          path: dist
          retention-days: 7
          if-no-files-found: error

      - name: Build Summary
        if: always()
        env:
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TESTS: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
          JOB_STATUS: ${{ job.status }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          icon() {
            case "$1" in
              success) echo "✅ $1" ;;
              skipped) echo "⏭️ $1" ;;
              *) echo "❌ $1" ;;
            esac
          }
          {
            echo "## Build Summary: $(icon "$JOB_STATUS")"
            echo ""
            echo "- **Event**: $EVENT"
            echo "- **Branch**: $BRANCH"
            echo "- **Commit**: $COMMIT"
            echo "- **TypeCheck**: $(icon "$TYPECHECK")"
            echo "- **Tests**: $(icon "$TESTS")"
            echo "- **Build**: $(icon "$BUILD")"
          } >> "$GITHUB_STEP_SUMMARY"
